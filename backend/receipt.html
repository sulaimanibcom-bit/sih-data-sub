<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SIH DATA SUB - Receipt</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #eeeeee;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      color: #111827;
    }

    .receipt {
      width: 100%;
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.12);
    }

    .header {
      text-align: center;
      border-bottom:
        2px solid #102b57;
      padding-bottom: 18px;
      margin-bottom: 18px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 10px;
      border-radius: 14px;
      background: #102b57;
      color: #f5b83d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 800;
    }

    .brand {
      margin: 0;
      color: #102b57;
      font-size: 22px;
      font-weight: 800;
    }

    .tagline {
      margin-top: 5px;
      color: #666666;
      font-size: 12px;
    }

    .status {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 14px;
      border-radius: 20px;
      background: #e8f7ee;
      color: #18733d;
      font-size: 12px;
      font-weight: 700;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      margin-bottom: 10px;
      color: #102b57;
      font-size: 14px;
      font-weight: 800;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom:
        1px solid #eeeeee;
      font-size: 13px;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #666666;
    }

    .value {
      text-align: right;
      font-weight: 600;
      word-break: break-word;
    }

    .amount-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #f7f9fc;
      text-align: center;
    }

    .amount-label {
      color: #666666;
      font-size: 12px;
    }

    .amount {
      margin-top: 5px;
      color: #102b57;
      font-size: 28px;
      font-weight: 800;
    }

    .reference {
      margin-top: 18px;
      padding: 12px;
      border: 1px dashed #bbbbbb;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
    }

    .reference strong {
      display: block;
      margin-top: 5px;
      color: #102b57;
      word-break: break-all;
    }

    .footer {
      margin-top: 24px;
      padding-top: 15px;
      border-top:
        1px dashed #cccccc;
      text-align: center;
      color: #777777;
      font-size: 11px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .print-btn {
      background: #102b57;
      color: white;
    }

    .close-btn {
      background: #eeeeee;
      color: #333333;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #777777;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .receipt {
        max-width: none;
        width: 100%;
        box-shadow: none;
        border-radius: 0;
      }

      .buttons {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div
    id="receipt"
    class="receipt"
  >

    <div class="header">

      <div class="logo">
        SD
      </div>

      <h1 class="brand">
        SIH DATA SUB
      </h1>

      <div class="tagline">
        Fast • Secure • Reliable
      </div>

      <div
        id="status"
        class="status"
      >
        Transaction Receipt
      </div>

    </div>

    <div
      id="content"
    ></div>

    <div class="buttons">

      <button
        class="print-btn"
        onclick="window.print()"
      >
        Print Receipt
      </button>

      <button
        class="close-btn"
        onclick="window.history.back()"
      >
        Close
      </button>

    </div>

    <div class="footer">
      Thank you for using SIH DATA SUB.<br>
      Keep this receipt for your records.
    </div>

  </div>

  <script>
    "use strict";

    function getParam(name) {
      const params =
        new URLSearchParams(
          window.location.search
        );

      return (
        params.get(name) || ""
      );
    }

    function escapeHTML(value) {
      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }

    function formatMoney(value) {
      const number =
        Number(value);

      if (
        !Number.isFinite(number)
      ) {
        return "₦0.00";
      }

      return (
        "₦" +
        number.toLocaleString(
          "en-NG",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        )
      );
    }

    function formatDate(value) {
      if (!value) {
        return "N/A";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return escapeHTML(
          value
        );
      }

      return date.toLocaleString(
        "en-NG",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );
    }

    function showReceipt() {
      const reference =
        getParam(
          "reference"
        );

      const type =
        getParam(
          "type"
        );

      const category =
        getParam(
          "category"
        );

      const description =
        getParam(
          "description"
        );

      const amount =
        getParam(
          "amount"
        );

      const status =
        getParam(
          "status"
        ) || "completed";

      const date =
        getParam(
          "date"
        );

      const balanceBefore =
        getParam(
          "balanceBefore"
        );

      const balanceAfter =
        getParam(
          "balanceAfter"
        );

      const content =
        document.getElementById(
          "content"
        );

      if (
        !reference &&
        !description &&
        !amount
      ) {
        content.innerHTML = `
          <div class="empty">
            No transaction information
            was provided.
          </div>
        `;

        return;
      }

      const safeStatus =
        escapeHTML(
          status
        );

      document.getElementById(
        "status"
      ).textContent =
        safeStatus
          .toUpperCase();

      content.innerHTML = `

        <div class="section">

          <div class="section-title">
            Transaction Details
          </div>

          <div class="row">
            <span class="label">
              Service
            </span>

            <span class="value">
              ${
                escapeHTML(
                  category ||
                  "Transaction"
                )
              }
            </span>
          </div>

          <div class="row">
            <span class="label">
              Description
            </span>

            <span class="value">
              ${
                escapeHTML(
                  description ||
                  "SIH DATA SUB transaction"
                )
              }
            </span>
          </div>

          <div class="row">
            <span class="label">
              Type
            </span>

            <span class="value">
              ${
                escapeHTML(
                  type ||
                  "N/A"
                )
              }
            </span>
          </div>

          <div class="row">
            <span class="label">
              Date
            </span>

            <span class="value">
              ${
                formatDate(
                  date
                )
              }
            </span>
          </div>

        </div>

        <div class="amount-box">

          <div class="amount-label">
            Transaction Amount
          </div>

          <div class="amount">
            ${
              formatMoney(
                amount
              )
            }
          </div>

        </div>

        <div class="section">

          <div class="section-title">
            Wallet Information
          </div>

          <div class="row">
            <span class="label">
              Balance Before
            </span>

            <span class="value">
              ${
                formatMoney(
                  balanceBefore
                )
              }
            </span>
          </div>

          <div class="row">
            <span class="label">
              Balance After
            </span>

            <span class="value">
              ${
                formatMoney(
                  balanceAfter
                )
              }
            </span>
          </div>

        </div>

        <div class="reference">

          Transaction Reference

          <strong>
            ${
              escapeHTML(
                reference ||
                "N/A"
              )
            }
          </strong>

        </div>
      `;
    }

    showReceipt();
  </script>

</body>
</html>
